[project]
name = "drive-rag"
version = "0.1.0"
description = "RAG over Mario's local Google Drive sync (docs, PDFs, the Obsidian vault), answered by Gemini via ninerouter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "model2vec>=0.9.0",
    "openpyxl>=3.1.5",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "sqlite-vec>=0.1.9",
    "tqdm>=4.70.0",
]

[dependency-groups]
server = [
    "fastapi>=0.118",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.34",
]

[tool.uv]
package = false
